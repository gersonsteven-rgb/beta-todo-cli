<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Fidelización</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/media/logo.png">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/vendor/jsqr.js" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="/media/logo.png" alt="">
      <h1>Panel del negocio</h1>
      <p class="muted">Ingresá para registrar compras y canjes.</p>
      <label class="field"><span>Correo</span><input class="input" name="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Contraseña</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
      <p class="error-box" id="login-error" hidden></p>
      <button class="btn primary big" style="width:100%">Ingresar</button>
      <div class="demo-creds">Demo: <b>admin@demo.com</b> / <b>demo1234</b></div>
      <p class="vendor-mark" data-vendor hidden></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><img data-logo src="/media/logo.png" alt=""><div><b data-biz></b><small data-prog></small></div></div>
      <nav class="nav" id="nav">
        <a href="#/caja" data-route="caja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 13v3"/></svg>Caja</a>
        <a href="#/panel" data-route="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Panel</a>
        <a href="#/clientes" data-route="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>Clientes</a>
        <a href="#/premios" data-route="premios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8S10.5 3.5 8 4.5 9 8 12 8zm0 0s1.5-4.5 4-3.5S15 8 12 8z"/></svg>Premios</a>
        <a href="#/promos" data-route="promos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10H3zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Campañas</a>
        <a href="#/qr" data-route="qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>QR registro</a>
        <a href="#/config" data-route="config" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</a>
      </nav>
      <div class="me"><div><b data-me></b><small><span data-role></span> · <span data-plan></span></small><p class="vendor-mark" data-vendor hidden></p></div><button class="btn sm" data-logout>Salir</button></div>
    </aside>
    <div>
      <header class="topbar">
        <div class="brand"><img data-logo src="/media/logo.png" alt=""><div><b data-biz></b><small data-prog></small></div></div>
        <button class="btn sm" data-logout>Salir</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
